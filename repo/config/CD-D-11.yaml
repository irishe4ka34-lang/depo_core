id: CFG-CD-D-11
title: Состояния и переходы по типу объекта
version: структура; значения не заданы
note: 'Отдельная машина состояний у каждого объекта: счёт, связь со счётом N, событие, внешняя операция, команда, сверка, выписка, дело. Переходы и условия — правило STATES; полный набор условий — вопрос MODEL-Q05. Статусы счёта соответствуют реестру счетов 892-П п.4.2.'
origin: КЭ1-03 § CD-D-11
fields:
- name: object_type
  type: Code
  note: тип объекта
- name: from_state
  type: Code
- name: to_state
  type: Code
- name: trigger
  type: Code
  note: событие или шаг
- name: actor_rule
  type: Predicate
  note: кто вправе
- name: guard
  type: Predicate
  note: проверяемое условие
- name: effect_or_refusal
  type: Rule
  note: эффект или отказ
- name: version
