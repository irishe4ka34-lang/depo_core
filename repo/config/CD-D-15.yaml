id: CFG-CD-D-15
title: Календарь, операционный день и сроки
version: структура; значения не заданы
note: 'Рабочие дни, часовой пояс, граница операционного дня и сроки. По 892-П п.1.3–1.4 операционный день единый и оканчивается не позднее 12:00 по московскому времени ближайшего рабочего дня; после его окончания операции за этот календарный день не совершаются. От конца операционного дня зависят выписка на дату (п.14.1) и окно исправления ошибок (п.1.6). Сроки 892-П, которые считает ядро: зачисление и списание — не позднее следующего рабочего дня после подтверждения (гл.11), акт сверки — в день сверки, его направление — не позднее следующего рабочего дня (гл.6), отчёт об операции — не позднее следующего рабочего дня (п.14.2), уведомление об открытии счёта — не позднее следующего дня (п.9.2). Старый расчёт воспроизводится с исходной версией календаря.'
origin: КЭ1-03 § CD-D-15
