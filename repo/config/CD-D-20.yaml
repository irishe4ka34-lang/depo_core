id: CFG-CD-D-20
title: Выписки и отчёты
version: структура; значения не заданы
note: Виды документов, поля, срезы и права адресата. Выписка на дату — на конец операционного дня; на произвольный момент — только по договору и с оговоркой о целях (892-П п.14.1). Отчёт об операции — не позднее следующего рабочего дня (п.14.2). Третьим лицам — по письменному указанию депонента (п.14.5). Форматы, подпись и канал — вопрос OD-05.
origin: КЭ1-03 § CD-D-20
