id: CFG-CD-D-23
title: Хранение legal hold и резервные копии
version: перенесено как есть
note: 'Назначение: назначить срок по категории/основанию/начальному событию и обеспечить восстановимость. Владелец предложение: владелец данных/юрист/эксплуатация. UC-058–065, 070, 072. SRC-018:P00758/P02797–P02803/P02815–P02821; SRC-023 «Правила» C37; «Открытые решения» A12:I12. Граница Э1: Профиль сохранности доказательств и восстановления ядра; юридические сроки не утверждаются. Зависимости: CD-D-20, CD-D-26.


  Содержание исходного каталога: Поля: класс объекта — код; основание — ссылка; начальное событие — правило; минимальный срок — длительность; более длинный применимый срок — правило приоритета; hold/условие снятия — правило; удаление по акту — процедура; копирование/целостность/восстановление — policy. Обязательность/точные эксплуатационные значения OPEN. В источниках различаются пять лет после прекращения отношений и самостоятельные более длительные сроки, включая десять лет; это правовая применимость OPEN и не единое TTL=5 лет. Оценочное SRC-026:P00807 «хранение не менее пяти лет» не заменяет классификацию. Число лет не утверждается этим каталогом; OD-08/15..


  Опора полей: RV2-06:P00447.


  Поля: класс объекта — код; основание — ссылка; начальное событие — правило; минимальный срок — длительность; более длинный применимый срок — правило приоритета; hold/условие снятия — правило; удаление по акту — процедура; копирование/целостность/восстановление — policy. Обязательность/точные эксплуатационные значения OPEN. В источниках различаются пять лет после прекращения отношений и самостоятельные более длительные сроки, включая десять лет; это правовая применимость OPEN и не единое TTL=5 лет. Оценочное SRC-026:P00807 «хранение не менее пяти лет» не заменяет классификацию. Число лет не утверждается этим каталогом; OD-08/15.


  Привязки к модели: evidence.retention_profile; evidence.content_hash; evidence.hash_algorithm; evidence.content_locator; statement.artifact_evidence_id; audit_event.evidence_id. Тип, обязательность и ключ каждого атрибута — в его карточке K01–K21.'
