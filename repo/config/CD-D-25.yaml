id: CFG-CD-D-25
title: Ручные решения и маршруты согласования
version: перенесено как есть
note: 'Назначение: определить допустимое действие и независимого контролёра; фасад не правит учёт напрямую. Владелец предложение: продукт/операционная функция/юрист. UC-040–041, 048–049, 073–074. SRC-022:P06462–P06464/P06553–P06571/P06619; SRC-023 «Правила» C39:C40, «Зафиксировано и метод» A8:D8. Граница Э1: В Э1 маршрут разбора без разрешения ручной правки или новой расходной функции; исполнение только после отдельного решения. Зависимости: CD-D-04, CD-D-05, CD-D-10, CD-D-16.


  Содержание исходного каталога: Поля: вид решения — код; допустимый исходный кейс — ссылка; требуемое основание/доказательства — перечень; разрешённая команда ядра/охват — ссылка/условие; роли maker/checker — ссылки; срок/эскалация — правило; критерий закрытия — проверка. Обязательность и перечень разрешённых видов OPEN OD-18/19. До решения возможен только разбор без исполнения. Пример запрещённого поведения — прямое изменение БД/неучтённый Excel; это не допустимое значение каталога. Повтор согласованного caseId не создаёт вторую операцию..


  Опора полей: RV2-06:P00453.


  Поля: вид решения — код; допустимый исходный кейс — ссылка; требуемое основание/доказательства — перечень; разрешённая команда ядра/охват — ссылка/условие; роли maker/checker — ссылки; срок/эскалация — правило; критерий закрытия — проверка. Обязательность и перечень разрешённых видов OPEN OD-18/19. До решения возможен только разбор без исполнения. Пример запрещённого поведения — прямое изменение БД/неучтённый Excel; это не допустимое значение каталога. Повтор согласованного caseId не создаёт вторую операцию.


  Привязки к модели: discrepancy_case.owner_ref; discrepancy_case.evidence_id; command_receipt.action; audit_event.authorization_context. Тип, обязательность и ключ каждого атрибута — в его карточке K01–K21.'
