id: CFG-CD-D-24
title: Инциденты защитные режимы и восстановление
version: перенесено как есть
note: 'Назначение: классифицировать риск/охват, применять и снимать проверяемую защиту. Владелец предложение: ИБ/эксплуатация/контроль. UC-025–026, 068–070. SRC-022:P06057–P06059/P06138–P06140/P06219–P06221; SRC-023 «Правила» C43. Граница Э1: Проверяемая действующая версия защитного режима; права, пороги и OD-14 остаются OPEN. Зависимости: CD-D-05, CD-D-10, CD-D-16, CD-D-28.


  Содержание исходного каталога: Поля: класс/приоритет — коды; зона влияния — правило выбора объектов; разрешённые/запрещённые действия — матрица; эскалация/ответственные — роли; критерии восстановления — контрольные проверки; сроки — параметры. Конкретная шкала, пороги/числа/обязательность OPEN OD-14/21. Пример источника: неопределённые внешние исходы и нарушение покрытия требуют проверки до снятия стопа. incidentId и фактические меры — операционные дела. При смене политики сохраняется версия применённого режима..


  Опора полей: RV2-06:P00450.


  Поля: класс/приоритет — коды; зона влияния — правило выбора объектов; разрешённые/запрещённые действия — матрица; эскалация/ответственные — роли; критерии восстановления — контрольные проверки; сроки — параметры. Конкретная шкала, пороги/числа/обязательность OPEN OD-14/21. Пример источника: неопределённые внешние исходы и нарушение покрытия требуют проверки до снятия стопа. incidentId и фактические меры — операционные дела. При смене политики сохраняется версия применённого режима.


  Привязки к модели: protection_version.scope; protection_version.version; protection_version.policy_ref; protection_version.effective_from; protection_version.activation_proof; accounting_operation.protection_id; discrepancy_case.protection_id. Тип, обязательность и ключ каждого атрибута — в его карточке K01–K21.'
