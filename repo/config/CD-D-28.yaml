id: CFG-CD-D-28
title: Параметры NFR и эксплуатационных проверок
version: перенесено как есть
note: 'Назначение: хранить измеримые профили и критерии испытаний с источником и статусом согласования. Владелец предложение: продукт/эксплуатация/ИБ. UC-017–026, 047, 060–074; SRC-026:P00780–P00837; SRC-023 «Открытые решения» A18:I18. Граница Э1: Параметры измерения отказных проверок, восстановления и конкуренции ядра; не обещание промышленного SLO. Зависимости: CD-D-23, CD-D-24, CD-D-27.


  Содержание исходного каталога: Поля: вид метрики — код; область/профиль нагрузки — описание; порог/единица — число/единица; окно измерения — период; отказной сценарий — ссылка; источник/статус/владелец — общие поля. Обязательность и принятые значения OPEN OD-14. В ТЗ есть оценочные примеры доступности, RPO/RTO, latency/throughput и объёма; P00780 прямо требует подтверждения профиля. Они не переносятся в рабочие defaults. Реальный отчёт испытания — отдельное доказательство; отсутствует стенд, поэтому каталог не подтверждает выполнение SLO..


  Опора полей: RV2-06:P00462.


  Поля: вид метрики — код; область/профиль нагрузки — описание; порог/единица — число/единица; окно измерения — период; отказной сценарий — ссылка; источник/статус/владелец — общие поля. Обязательность и принятые значения OPEN OD-14. В ТЗ есть оценочные примеры доступности, RPO/RTO, latency/throughput и объёма; P00780 прямо требует подтверждения профиля. Они не переносятся в рабочие defaults. Реальный отчёт испытания — отдельное доказательство; отсутствует стенд, поэтому каталог не подтверждает выполнение SLO.


  Привязки к модели: evidence.content_locator; evidence.verification_result; protection_version.activation_proof. Тип, обязательность и ключ каждого атрибута — в его карточке K01–K21.'
origin: КЭ1-03 § CD-D-28
review:
- Числовые показатели не заданы (BR-NFR-03/08) — ждут владельца бизнеса.
- Количество описано как decimal — по решению REV-R12 это целое число минимальных единиц с масштабом выпуска.
