id: CFG-CD-D-13
title: Ограничения обременения и основания снятия
version: перенесено как есть
note: 'Назначение: определить применимый эффект на доступное количество и расход без изменения общего количества от ограничения. Владелец предложение: учёт/юрист/контроль. UC-042–045. SRC-026:P00192–P00193; SRC-023 «Правила» C28:C29; SRC-022:P06631–P06632. Граница Э1: Только правило влияния ограничения на доступность и защитный тест; реестр обременений и их жизненный цикл за пределами этих 21 сущности. Зависимости: CD-D-08, CD-D-10, CD-D-24.


  Содержание исходного каталога: Поля: вид основания/ограничения — классификатор; объект/охват — ссылка/условие; допустимая операция — ссылка; объём/срок — количество/период; требуемые документы/согласования — ссылки. Типы/обязательность OPEN; фактические restriction/release IDs принадлежат операционным экземплярам. Примеры: блокировка, обременение, снятие в установленном объёме. Допустимость ареста/взыскания по виду счёта OPEN OD-13, не берётся автоматически из старого ТЗ. Пересечение оснований и частичное снятие требуют отдельной модели, а не суммы произвольных флагов..


  Опора полей: RV2-06:P00417.


  Поля: вид основания/ограничения — классификатор; объект/охват — ссылка/условие; допустимая операция — ссылка; объём/срок — количество/период; требуемые документы/согласования — ссылки. Типы/обязательность OPEN; фактические restriction/release IDs принадлежат операционным экземплярам. Примеры: блокировка, обременение, снятие в установленном объёме. Допустимость ареста/взыскания по виду счёта OPEN OD-13, не берётся автоматически из старого ТЗ. Пересечение оснований и частичное снятие требуют отдельной модели, а не суммы произвольных флагов.


  Привязки к модели: position_projection.total_quantity; position_projection.available_quantity; protection_version.policy_ref; accounting_operation.protection_id. Тип, обязательность и ключ каждого атрибута — в его карточке K01–K21.'
origin: КЭ1-03 § CD-D-13
review:
- 'quantity: ExactDecimal → целое число минимальных единиц (REV-R12). Сущности экземпляра ограничения нет (MODEL-Q11).'
- Ссылается на закрытые вопросы OD-11/OD-13/UC027-Q3 — виды счетов и разделы решены (DEC-2026-10-21-01, -02, REV-R20), параметры выпуска — DEC-2026-10-21-04.
- Количество описано как decimal — по решению REV-R12 это целое число минимальных единиц с масштабом выпуска.
