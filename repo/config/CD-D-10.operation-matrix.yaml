id: CFG-CD-D-10
title: Матрица допустимых операций по профилям прав
version: 2026-10-21.1
source: [NR-892-9#11.9, NR-282-7#profiles]
note: >-
  Строка разрешает операцию для профиля права, вида счёта, основания и роли. Незаданное сочетание не разрешено.
  Общие проверки G для каждой строки: режим и версия правила; актив и версия; состояние счёта и выпуска; основание и серверные полномочия;
  ограничения и квалификация получателя; доступный остаток для расхода; единица и точность (REV-R12); нет повторного эффекта и конкурентного превышения;
  аудит; внешняя финальность, если действие зависит от внешней стороны. Неизвестный внешний исход сохраняет удержание и запрет повторного расхода.
  Операции со счётом (открытие, закрытие, приостановление, выписки) — не строки этой матрицы, они проверяются по виду и состоянию счёта (REV-R23).
operations:
  - {code: MX01, operation: Зачисление,                         PF1: да, PF2: да, PF3: да, PF4: да, accounts: "O, T", basis: "подтверждённое внешнее поступление", extra_checks: "связь с AA и внешним N; однократный эффект", enabled_e1: "да (UC-037)"}
  - {code: MX02, operation: Списание,                           PF1: да, PF2: да, PF3: да, PF4: да, accounts: "O, T", basis: "законное распоряжение", extra_checks: "достаточный доступный остаток; нет запрета", enabled_e1: нет}
  - {code: MX03, operation: Внутренний перевод,                 PF1: да, PF2: да, PF3: да, PF4: да, accounts: "O, T → O, T", basis: "распоряжение о переходе", extra_checks: "связанные расход и приход; допустимость получателя", enabled_e1: нет}
  - {code: MX04, operation: Входящий через ОИС / верхний ЦД,    PF1: да, PF2: да, PF3: да, PF4: да, accounts: "O, T + AA", basis: "внешнее подтверждение", extra_checks: "подтверждение выбранного верхнего участника; повтор без второго эффекта", enabled_e1: "да (UC-046/037)"}
  - {code: MX05, operation: Исходящий через ОИС / верхний ЦД,   PF1: да, PF2: да, PF3: да, PF4: да, accounts: "O, T + AA", basis: "распоряжение и реквизиты назначения", extra_checks: "резерв; финальность; неизвестный исход без повторной отправки", enabled_e1: нет}
  - {code: MX06, operation: "Обременение, изменение, прекращение", PF1: да, PF2: да, PF3: да, PF4: да, accounts: "O, T", basis: "документ обременения", extra_checks: "приоритет и пересечения; прекращение одного основания не снимает другие", enabled_e1: нет}
  - {code: MX07, operation: Ограничение и снятие,               PF1: да, PF2: да, PF3: да, PF4: да, accounts: "O, T", basis: "основание установки / снятия", extra_checks: "истечение ожидания не снимает защиту", enabled_e1: "только запрет"}
  - {code: MX08, operation: Коррекция,                          PF1: да, PF2: да, PF3: да, PF4: да, accounts: "затронутые счета", basis: "ошибка и основание исправления", extra_checks: "ссылка на исходную запись; без переписывания прошлого", enabled_e1: нет}
  - {code: MX09, operation: Денежные выплаты,                   PF1: "если предусмотрены", PF2: "уточнить по выпуску", PF3: "если предусмотрены", PF4: "только с отдельным денежным правом", accounts: "денежный процесс", basis: "решение и факт получения", extra_checks: "причитается / получено / распределено раздельно", enabled_e1: нет}
  - {code: MX10, operation: Инструкции и осуществление прав,    PF1: нет, PF2: "уточнить по выпуску", PF3: да, PF4: нет, accounts: "номинальная цепочка", basis: "волеизъявление держателя", extra_checks: "объём удостоверенных прав", enabled_e1: нет}
  - {code: MX11, operation: Требование поставки ЦБ,             PF1: нет, PF2: "уточнить по выпуску", PF3: нет, PF4: да, accounts: "внешний контур ЦБ", basis: "срок или событие, инструкция", extra_checks: "подтверждение фактической поставки", enabled_e1: нет}
  - {code: MX12, operation: Отражение погашения,                PF1: да, PF2: да, PF3: да, PF4: да, accounts: "затронутые записи", basis: "законное прекращение обязательств", extra_checks: "не календарная дата и не частичная выплата", enabled_e1: нет}
