id: CFG-CD-D-03
title: Договорные шаблоны и подписываемые пакеты
version: перенесено как есть
note: 'Назначение: связать договор с применимой версией условий и одним подписываемым содержимым. Владелец предложение: юрист/операционная функция. UC-007–008. SRC-022:P00756–P00758/P00835–P00839; SRC-026:P00293–P00295. Граница Э1: Ссылка на шаблон/подписываемое основание; юридический договор ядром не создаётся. Зависимости: CD-D-01, CD-D-04.


  Содержание исходного каталога: Поля: версия шаблона — версия; редакция условий/тарифа — ссылки; состав пакета — ссылки на документы; применимая матрица подписей — ссылка; период действия — даты. Обязательность отдельных атрибутов OPEN; необходимость согласованного шаблона и матрицы прямо в P00756. Примеры состояний экземпляра договора «Готов к подписанию», «Действует» не являются видами шаблона. OPEN: типы договоров/приложений, юридическая форма, правила изменения/прекращения; OD-07. Подписи клиента и ЦД хранятся на экземпляре, не в каталоге шаблона..


  Опора полей: RV2-06:P00387.


  Поля: версия шаблона — версия; редакция условий/тарифа — ссылки; состав пакета — ссылки на документы; применимая матрица подписей — ссылка; период действия — даты. Обязательность отдельных атрибутов OPEN; необходимость согласованного шаблона и матрицы прямо в P00756. Примеры состояний экземпляра договора «Готов к подписанию», «Действует» не являются видами шаблона. OPEN: типы договоров/приложений, юридическая форма, правила изменения/прекращения; OD-07. Подписи клиента и ЦД хранятся на экземпляре, не в каталоге шаблона.


  Привязки к модели: basis_ref.kind; basis_ref.external_key; basis_ref.version; basis_ref.evidence_id; account.basis_id. Тип, обязательность и ключ каждого атрибута — в его карточке K01–K21.'
