id: CFG-CD-D-01
title: Редакции условий деятельности и тарифов
version: перенесено как есть
note: 'Назначение: выбрать применимую редакцию для договора/действия и сохранить историю. Владелец предложение: продукт ЦД совместно с юристом; роли подтверждены SRC-020 «Роль процесс действие» E8:G10. UC-001–003, 007–008, 071. Граница Э1: Только версия условий, указанная основанием; тарифный расчёт и публикация вне ядра. Зависимости: не выделены.


  Содержание исходного каталога: ID и версия редакции; Период действия; Утверждающий и основание; Комплект документов; Время публикации отдельно от даты действия.


  Опора полей: RV2-06:P00365, RV2-06:P00368, RV2-06:P00371, RV2-06:P00374, RV2-06:P00377.


  Условия исходных полей: Наличие подтверждено SRC-022:P00243; формат OPEN; Семантически необходим по P00243; nullability конца OPEN; P00243; схема полномочия OPEN; P00243; состав OPEN; P00328; календарная точность OPEN.


  Примеры исходных состояний: «Утверждена»; предыдущая публичная редакция остаётся в архиве (P00243/P00328). Не использовать «утверждена» как «опубликована». OPEN: структура тарифной ставки/формулы и единиц расчёта, исключения/сроки уведомления, конфликт периодов; OD-03/04/17. Это каталог редакций, не готовый биллинг.


  Термины источника, не утверждённые коды: Утверждена.


  Привязки к модели: basis_ref.kind; basis_ref.version; basis_ref.evidence_id. Тип, обязательность и ключ каждого атрибута — в его карточке K01–K21.'
origin: КЭ1-03 § CD-D-01
review:
- Много ссылок на исходный каталог пакета (20) — при ревью перенести в origin, в тексте оставить нормы и правила.
