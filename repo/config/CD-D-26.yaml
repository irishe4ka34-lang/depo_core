id: CFG-CD-D-26
title: Версии правил и карты миграции
version: перенесено как есть
note: 'Назначение: вводить изменения без переписывания прошлого и переносить только согласованный объём. Владелец предложение: владелец данных/продукт/контроль. UC-071–072. SRC-022:P06300–P06302/P06381–P06383; SRC-026:P00905–P00907; SRC-023 «Открытые решения» A19:I19/A24:I25. Граница Э1: Только сохранение применённых версий правил и воспроизводимость; промышленная миграция отложена. Зависимости: CD-D-01, CD-D-08, CD-D-09, CD-D-10, CD-D-16, CD-D-20.


  Содержание исходного каталога: Поля: версия правила/источник/период/владелец/утверждение — общая модель; исходная/целевая схема и карта полей/ID — mapping; окно/резерв/обратный переход — ссылки на план; контроль полноты/сверки — правила. Типы/обязательность и фактические mappings OPEN, источники/репозиторий не переданы. План/запуск/результат миграции — факты отдельно. OD-15/20/21; пример из источника — сначала загрузить справочники и параметры с версиями действия, а не обойти ядро прямой вставкой..


  Опора полей: RV2-06:P00456.


  Поля: версия правила/источник/период/владелец/утверждение — общая модель; исходная/целевая схема и карта полей/ID — mapping; окно/резерв/обратный переход — ссылки на план; контроль полноты/сверки — правила. Типы/обязательность и фактические mappings OPEN, источники/репозиторий не переданы. План/запуск/результат миграции — факты отдельно. OD-15/20/21; пример из источника — сначала загрузить справочники и параметры с версиями действия, а не обойти ядро прямой вставкой.


  Привязки к модели: accounting_operation.rule_refs; instrument_version.source_version; custody_link.version; position_projection.calculation_version; statement.calculation_version; audit_event.event_kind. Тип, обязательность и ключ каждого атрибута — в его карточке K01–K21.'
