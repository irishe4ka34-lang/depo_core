id: CFG-CD-D-16
title: Методики сверки и категории расхождений
version: структура; значения не заданы
note: Сравнение позиций депонентов, счёта активов AA и внешнего остатка на одном срезе (R-002, R-026); полнота и категории расхождений; защитная мера. Источник внешнего остатка — последний электронный документ вышестоящего на дату сверки (892-П п.6.1). Пороги и допуски не заданы.
origin: КЭ1-03 § CD-D-16
