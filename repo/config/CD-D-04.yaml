id: CFG-CD-D-04
title: Юридические полномочия и подписи
version: перенесено как есть
note: 'Назначение: определить действие, предел и доказательство права представителя. Владелец предложение: юрист/ИБ; UC-008, 010, 020–022, 034–036, 045. SRC-026:P00176–P00177/P00309–P00311; SRC-023 «Открытые решения» A11:I11/A30:I30. Граница Э1: Проверяемое полномочие для серверного допуска и отказа; не собственный юридический реестр ядра. Зависимости: CD-D-03, CD-D-05.


  Содержание исходного каталога: Поля настройки: вид действия/объём — список разрешений; лимиты — количество/денежная сумма по применимости; срок — период; тип доверенности/доказательства — классификатор; применимый вид ЭП и проверка сертификата/времени/отзыва — ссылки на policy. Типы и обязательность OPEN; нельзя считать сертификат универсальным юридическим полномочием. Реальные представитель/доверенность/сертификат — экземпляры Authority/Evidence. Пример поведения источника: просроченное полномочие блокирует подачу (SRC-026:P00311). Неизвестны виды ЭП, лимиты, источники отзыва, срок проверки; OD-07/27. Историческое подтверждение не заменяет актуальную проверку перед новым действием..


  Опора полей: RV2-06:P00390.


  Поля настройки: вид действия/объём — список разрешений; лимиты — количество/денежная сумма по применимости; срок — период; тип доверенности/доказательства — классификатор; применимый вид ЭП и проверка сертификата/времени/отзыва — ссылки на policy. Типы и обязательность OPEN; нельзя считать сертификат универсальным юридическим полномочием. Реальные представитель/доверенность/сертификат — экземпляры Authority/Evidence. Пример поведения источника: просроченное полномочие блокирует подачу (SRC-026:P00311). Неизвестны виды ЭП, лимиты, источники отзыва, срок проверки; OD-07/27. Историческое подтверждение не заменяет актуальную проверку перед новым действием.


  Привязки к модели: command_receipt.actor_ref; audit_event.authorization_context; basis_ref.evidence_id. Тип, обязательность и ключ каждого атрибута — в его карточке K01–K21.


  1.4 · Посредники и идентификация. Полномочия посредников ведутся сущностью K24; форма доверенности, утверждённая ЦД, — настройка этого справочника.'
origin: КЭ1-03 § CD-D-04
review:
- Количество описано как decimal — по решению REV-R12 это целое число минимальных единиц с масштабом выпуска.
