id: K21
entity: evidence
title: Неизменяемое доказательство
note: 'Неизменяемое доказательство: оригинал или проверяемый локатор, контрольная сумма и результат проверки происхождения. Документ-основание регистрируется с уникальным номером, датой и временем в день получения (892-П п.1.12). Для UC-027 подпись проверяет сотрудник; здесь хранится результат его проверки. Сроки хранения — MODEL-Q10.'
origin: 'КЭ1-03 § K21; Связанные UC: все Э1. Опора: E1-03:P00126–P00129; P00177–P00179. Для UC-027 получение комплекта и проверку подписи/документа выполняет сотрудник; evidence хранит относящееся к этому доказательство, а не обещает автоматическую проверку ядром.'
fields:
- name: id
  title: Внутренний ключ этой записи
  type: ID
  required: Да
  key: PK
  note: ''
- name: source_system
  title: Происхождение
  type: Код
  required: Да
  key: ''
  note: Каталог источников
- name: content_locator
  title: Локатор неизменяемого содержимого
  type: Локальная ссылка
  required: Да
  key: ''
  note: Доступ по полномочиям; без внешней выгрузки
- name: content_hash
  title: Контрольная сумма
  type: Хэш
  required: Да
  key: ''
  note: Алгоритм отдельно в hash_algorithm; Проверяется при чтении; совпадение не доказывает правомерность
- name: hash_algorithm
  title: Алгоритм хэша
  type: Код
  required: Да
  key: ''
  note: алгоритм — по профилю доказательств
- name: verification_result
  title: Проверка происхождения/подписи
  type: Структурированный снимок
  required: Да; finality=CONFIRMED
  key: ''
  note: Отдельно подлинность, полнота, финальность; не один флаг trusted. В UC-027 фиксируется результат проверки сотрудником, отдельно от системной валидации реквизитов. Средство проверки и точный состав снимка — UC027-Q1; наличие хэша не заменяет проверку ЭП
- name: received_at
  title: Получение
  type: Момент
  required: Да
  key: ''
  note: UTC и исходная зона
- name: retention_profile
  title: Профиль хранения и запрета удаления
  type: Версионированная ссылка
  required: Да
  key: CD-D-23; MODEL-Q10
  note: Срок не выдумывается; применимый hold запрещает удаление
- name: doc_kind
  title: Вид документа
  type: Код
  required: Да
  note: 'например: исходящее заявление, уведомление об открытии счёта N, отказ, документ о присоединении к правилам ИС, правила ИС, доверенность'
- name: registration_no
  title: Регистрационный номер документа
  type: Текст
  required: Да
  key: U1
  trace: NR-892-9#1.12
  note: присваивается ЦД в день получения
- name: registered_at
  title: Дата и время регистрации
  type: Момент
  required: Да
  trace: NR-892-9#1.12
  note: после окончания рабочего дня — не позднее следующего рабочего дня
