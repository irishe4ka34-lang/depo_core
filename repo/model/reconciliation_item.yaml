id: K14
entity: reconciliation_item
title: Результат сравнения
note: 'Результат сравнения по выпуску и месту: разницы «обязательства − активы» и «активы − внешние» (схема — LEVELS). Снимок входов и результата неизменен; MISMATCH журнал не исправляет. Обязательства — по всем счетам O и N этого места учёта, включая счета посредников.'
origin: 'КЭ1-03 § K14; Связанные UC: 047,048. Опора: E1-03:P00042–P00043; P00145–P00146; P00154.'
