id: K04
entity: custody_link
title: Версия внешней связи
note: 'Проверенная связь выпуска с внешним счётом N нашего ЦД и местом учёта. Смена реквизитов или статуса счёта у ОИС — новая проверка и новая версия; операции ссылаются на версию, действовавшую при проведении. Связь не создаёт ни позиции депонента, ни покрытия. Это запись «выпуск X учитывается на нашем счёте N у оператора Y»: без неё зачисления выпуска не принимаются. Конфликтующие связи — C12. Вид верхнего участника определяет вид счёта активов: ОИС → AA01, вышестоящий ЦД → AA00; как AA ведётся в реестре счетов — вопрос RV-06.'
origin: 'КЭ1-03 § K04; Связанные UC: 032,033. Опора: E1-03:P00022–P00024; P00074–P00077; P01252. UC-032 описывает ручное получение результата внешнего открытия; UC-033 сохраняет и проверяет связь. Сама связь не создаёт ни клиентской позиции, ни внутреннего покрытия.'
