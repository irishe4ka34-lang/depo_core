id: K16
entity: statement
title: Экземпляр выписки
note: Экземпляр выписки, закреплённый за счётом, срезом и версиями; после выдачи неизменен, исправление — новый экземпляр. Выписка на дату — на конец операционного дня; на произвольный момент — только по договору и с оговоркой о целях (892-П п.14.1). Подпись и доставка без доказательства не считаются выполненными.
origin: 'КЭ1-03 § K16; Связанные UC: 056,057. Опора: E1-03:P01163–P01202; P01847.'
