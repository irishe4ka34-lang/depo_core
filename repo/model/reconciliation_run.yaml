id: K13
entity: reconciliation_run
title: Запуск сверки
note: Запуск сверки на одном срезе с сохранёнными версиями. Повтор той же команды возвращает прежний запуск; контрольный запуск — новая команда со ссылкой на прежний. При расхождении хранит акт (составляется в день сверки) и время его направления в Банк России (не позднее следующего рабочего дня) — 892-П пп.6.2–6.3.
origin: 'КЭ1-03 § K13; Связанные UC: 047. Опора: E1-03:P00118–P00121; P00153–P00156.'
