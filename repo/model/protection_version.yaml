id: K20
entity: protection_version
title: Версия защитного режима
note: 'Версия защитного режима: охват запретов, проверяемый до эффекта. Содержимое версии неизменно; активация и подтверждение на путях исполнения журналируются. Публикация версии не доказывает действие защиты. Матрица режимов — OD-14, MODEL-Q08.'
origin: 'КЭ1-03 § K20; Связанные UC: 069,070. Опора: E1-03:P01010–P01013; RV2-05:P00625; P00635.'
