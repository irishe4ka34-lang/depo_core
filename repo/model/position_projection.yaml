id: K09
entity: position_projection
title: Проекция позиции
note: Позиция, пересчитываемая из неизменного журнала на заданный cutoff. Не самостоятельное основание права; количество не правится прямым вводом. Заблокированного и обременённого количества в модели пока нет (MODEL-Q11).
origin: 'КЭ1-03 § K09; Связанные UC: 037,047,056. Опора: E1-03:P00028–P00043; P00078–P00081; P00140.'
