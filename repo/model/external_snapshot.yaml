id: K12
entity: external_snapshot
title: Подтверждённый внешний срез
note: 'Количество на внешнем счёте N на точный момент, с полнотой и происхождением. Источник для сверки — последний электронный документ вышестоящего на дату сверки (892-П п.6.1). Неизменяемый снимок: новый ответ прежний не переписывает; отсутствие ответа не создаёт строку с нулём.'
origin: 'КЭ1-03 § K12; Связанные UC: 047. Опора: E1-03:P00082–P00085; P00145–P00146; P01163–P01202.'
