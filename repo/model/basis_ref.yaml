id: K02
entity: basis_ref
title: Снимок основания
note: 'Неизменяемый снимок основания: договор цифрового учёта — основание любого пассивного счёта, кроме NCA, CPA, XX и XY (892-П п.9.1), — или доверенность представителя. Для счёта N у ОИС — присоединение к правилам ИС оператора; документы прикрепляются к снимку (DEC-2026-10-22-01). Истекла доверенность подписанта — новый снимок. У счёта — снимок на момент открытия; последующие основания — новые снимки. Виды «договор с посредником и полномочие клиента» и «договор с номинальным держателем» включаются после решения RCD-D2.'
origin: 'КЭ1-03 § K02; Связанные UC: 029. Опора: E1-00:P00004; E1-03:P00054–P00057; P00302–P00314.'
