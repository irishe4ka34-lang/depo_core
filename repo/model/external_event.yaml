id: K10
entity: external_event
title: Принятое внешнее событие
note: 'Сохранённое сообщение ОИС и результат его проверки. Приём не равен проведению; исходное содержимое неизменно, история обработки — в аудите. Повторы распознаются по источнику и ID события. У РЦД событие — сохранённый ответ на опрос статуса: ID = receiptId + updateNo; неизвестный код статуса → QUARANTINED.'
origin: 'КЭ1-03 § K10; Связанные UC: 046,037. Опора: E1-03:P00133–P00139; P01127–P01162.'
