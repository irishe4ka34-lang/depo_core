id: K22
entity: reservation
title: Резерв
note: Локальное удержание количества под конкретное внешнее поручение расхода или перевода. Создаётся в T5, завершается в T6 или снимается по доказанному отказу; по тайм-ауту не снимается. Не равен статусу RESERVING и обособлению TO у РЦД — они сравниваются в K14. Цель — профиль РЦД.
origin: КЭ1-03 § K22
