id: K08
entity: accounting_entry
title: Неизменяемая запись учёта
note: 'Первичная запись изменения количества на одном из двух уровней: ACCOUNT — счёт депонента, COVERAGE — счёт активов AA. Двойная запись по 892-П п.8.6: приход на пассивный счёт сопровождается приходом на активный. Только добавление; исправление — новой записью со ссылкой на исходную.'
origin: 'КЭ1-03 § K08; Связанные UC: 037,041,056. Опора: E1-03:P00028–P00043; P00098–P00101; P00140–P00141.'
fields:
