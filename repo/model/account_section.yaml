id: K06
entity: account_section
title: Раздел счёта
note: 'Необязательное обособление внутри счёта (892-П п.7.5). Отсутствие раздела — явное значение, а не фиктивный раздел. Раздел под посредника не используется: на пару «клиент + посредник» открывается отдельный счёт (REV-R20); вопрос OD-13 закрыт.'
